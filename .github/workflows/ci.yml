name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Worker types
        run: npm run generate-types

      - name: Svelte check
        run: npm run check:svelte

      - name: Run tests
        run: npm run test:run

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build
